name: Deploy CivicGuide AI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Run ESLint
        run: cd frontend && npm run lint || true

      - name: Check TypeScript
        run: cd frontend && npx tsc --noEmit

      - name: Build Next.js
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://civicguide-api.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  backend-check:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt

      - name: Lint with ruff
        run: cd backend && ruff check . || true

      - name: Check imports and syntax
        run: cd backend && python -c "import main; import utils.gemini; import agents.election_agent"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: frontend-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          scope: ${{ secrets.VERCEL_ORG_ID }}
          production: true

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Frontend deployed to: ${{ steps.vercel.outputs.preview-url }}`
            })

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: backend-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deployment
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render deploy trigger"
            exit 0
          fi

          curl --request POST \
            --url "$RENDER_DEPLOY_HOOK_URL" \
            --header 'Content-Type: application/json' \
            --data '{"clearCache":"clear"}'

      - name: Wait for deployment
        run: sleep 5

      - name: Verify backend health
        run: |
          for i in {1..30}; do
            if curl -f https://civicguide-api.onrender.com/health; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for backend..."
            sleep 2
          done
          echo "❌ Backend failed to start"
          exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.frontend-check.result }}" == "success" ] && [ "${{ needs.backend-check.result }}" == "success" ]; then
            echo "✅ All checks passed!"
          else
            echo "❌ Some checks failed"
            exit 1
          fi
