name: LHCI Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start Next.js (standalone) server
        working-directory: frontend
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 120000

      - name: Run LHCI autorun
        working-directory: frontend
        env:
          CI: true
        run: npx -y @lhci/cli autorun --config=./.lighthouseci/config.json

      - name: Upload LHCI report (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: frontend/.lighthouseci
