services:
  - type: web
    name: civicguide-api
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://civicguide-ai.vercel.app
  services:
    - type: web
      name: civicguide-api
      env: python
      region: singapore
      plan: free
      branch: main
      rootDir: backend
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
      healthCheckPath: /health
      autoDeploy: true
      envVars:
        - key: GOOGLE_API_KEY
          sync: false
        - key: GEMINI_MODEL
          value: gemini-1.5-flash
        - key: GEMINI_PRO_MODEL
          value: gemini-1.5-pro
        - key: SUPABASE_URL
          sync: false
        - key: SUPABASE_SERVICE_KEY
          sync: false
        - key: SUPABASE_ANON_KEY
          sync: false
        - key: TAVILY_API_KEY
          sync: false
        - key: FRONTEND_URL
          value: https://civicguide-ai.vercel.app
        - key: ENVIRONMENT
          value: production